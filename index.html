<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Improve</title>
<meta name="description" content="Daily, weekly and monthly habits.">
<meta name="theme-color" content="#f4f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Improve">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="assets/app-icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/app-icons/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<script>
  // Set light/dark before the first paint (same rule as js/theme.js: dark 7 PM → 4 AM unless switched).
  (function () {
    var t, now = new Date(), m = now.getHours() * 60 + now.getMinutes();
    try { var o = JSON.parse(localStorage.getItem(/\/dev\//.test(location.pathname) ? 'imp_dev_theme' : 'imp_theme')); if (o && o.until > now.getTime()) t = o.mode; } catch (e) {}
    if (t !== 'dark' && t !== 'light') t = m >= 1140 || m < 240 ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
    document.querySelector('meta[name="theme-color"]').content = t === 'dark' ? '#0b0d12' : '#f4f5f7';
  })();
</script>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/food.css">
<link rel="stylesheet" href="css/money.css">

<link rel="stylesheet" href="js/planner/planner.css">
</head>
<body class="imp-root">
  <div class="app">
    <header class="hud" id="hud"></header>
    <main id="screen"></main>
  </div>
  <nav class="imp-tabbar" id="tabbar" aria-label="Tabs"></nav>
  <noscript><p style="padding:16px">Improve needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
