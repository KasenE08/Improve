<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Improve</title>
<meta name="description" content="Daily, weekly and monthly habits.">
<meta name="theme-color" content="#f4f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Improve">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="assets/app-icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/app-icons/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<script>
  // Set light/dark before the first paint (same rule as js/theme.js: dark 7 PM → 4 AM unless switched).
  (function () {
    var t, now = new Date(), m = now.getHours() * 60 + now.getMinutes();
    try { var o = JSON.parse(localStorage.getItem(/\/dev\//.test(location.pathname) ? 'imp_dev_theme' : 'imp_theme')); if (o && o.until > now.getTime()) t = o.mode; } catch (e) {}
    if (t !== 'dark' && t !== 'light') t = m >= 1140 || m < 240 ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
    document.querySelector('meta[name="theme-color"]').content = t === 'dark' ? '#0b0d12' : '#f4f5f7';
  })();
</script>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/food.css">
<link rel="stylesheet" href="css/money.css">
<link rel="stylesheet" href="css/journal.css">
</head>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
    <linearGradient id="fo1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff7a00"/><stop offset="1" stop-color="#ffb340"/></linearGradient>
    <linearGradient id="fi1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#fff6d6"/></linearGradient>
    <linearGradient id="fo2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e8200c"/><stop offset=".55" stop-color="#ff5a12"/><stop offset="1" stop-color="#ffa21f"/></linearGradient>
    <linearGradient id="fi2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffc533"/><stop offset="1" stop-color="#fff1b0"/></linearGradient>
    <linearGradient id="fo3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#0b4fe0"/><stop offset=".6" stop-color="#2f8bff"/><stop offset="1" stop-color="#7cd0ff"/></linearGradient>
    <linearGradient id="fi3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#bfe7ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="fo4" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4a06b8"/><stop offset=".55" stop-color="#8a2cff"/><stop offset="1" stop-color="#d07bff"/></linearGradient>
    <linearGradient id="fi4" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e6c2ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  </defs></svg>
  <div class="app">

  </div>

  <script type="module" src="js/app.js"></script>

</html>
