<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04070c">
<title>Improve · Style A Tactical</title>
<link rel="stylesheet" href="base.css">
<style>
@font-face { font-family: Rajdhani; font-weight: 500; font-display: swap; src: url(fonts/rajdhani-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: Rajdhani; font-weight: 600; font-display: swap; src: url(fonts/rajdhani-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: Rajdhani; font-weight: 700; font-display: swap; src: url(fonts/rajdhani-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: 'Chakra Petch'; font-weight: 400; font-display: swap; src: url(fonts/chakra-petch-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'Chakra Petch'; font-weight: 600; font-display: swap; src: url(fonts/chakra-petch-latin-600-normal.woff2) format('woff2'); }

:root {
  --bg: #04070c; --panel: #08111b; --panel-2: #0b1824;
  --line: rgba(0, 229, 255, .28); --line-soft: rgba(0, 229, 255, .12);
  --accent: #00e5ff; --accent-2: #0a84ff; --on-accent: #001218;
  --text: #d8f6ff; --muted: #6f8ea0;
  --cut: 12px;
  --f-head: Rajdhani, system-ui, sans-serif; --f-num: 'Chakra Petch', ui-monospace, monospace;
}
body {
  background: var(--bg); color: var(--text); font: 500 16px/1.3 var(--f-head);
  background-image:
    radial-gradient(ellipse at 50% -20%, rgba(0, 160, 255, .18), transparent 60%),
    linear-gradient(var(--line-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
  background-size: 100% 100%, 32px 32px, 32px 32px;
  background-attachment: fixed;
}
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

/* Chamfered panel with a 1px edge */
.panel { position: relative; isolation: isolate; padding: 14px 16px 10px;
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
  background: var(--line); }
.panel::before { content: ""; position: absolute; inset: 1px; z-index: -1; background: linear-gradient(180deg, var(--panel-2), var(--panel));
  clip-path: inherit; }
.panel::after { content: ""; position: absolute; top: 0; right: 18px; width: 40px; height: 2px; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.panel-head { padding-bottom: 8px; border-bottom: 1px solid var(--line-soft); margin-bottom: 2px; }
.panel-head h2 { font-weight: 700; font-size: 14px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 8px; }
.panel-head h2::before { content: ""; width: 4px; height: 14px; background: var(--accent); box-shadow: 0 0 6px var(--accent); }
.count { color: var(--muted); font-size: 13px; }
.count .ic { color: var(--accent); width: 18px; height: 18px; }

/* HUD header */
.hud { padding-top: 22px; }
.lvl-wrap { filter: drop-shadow(0 0 8px rgba(0, 229, 255, .45)); }
.lvl { width: 64px; height: 72px; background: var(--accent);
  clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); filter: drop-shadow(0 0 10px rgba(0,229,255,.5)); }
.lvl::before { content: ""; position: absolute; inset: 2px; background: radial-gradient(circle at 50% 30%, #0f2a3a, #050b12 70%); clip-path: inherit; }
.lvl > * { position: relative; }
.lvl-label { font-size: 11px; font-weight: 700; letter-spacing: .25em; color: var(--muted); margin-bottom: -4px; padding-left: .25em; }
.lvl-num { font: 600 30px/1 var(--f-num); color: var(--accent); text-shadow: 0 0 10px rgba(0, 229, 255, .7); }
.name { font-weight: 700; font-size: 22px; letter-spacing: .14em; }
.rank { font-size: 12px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--accent);
  border: 1px solid var(--line); padding: 1px 8px; }
.xpbar { height: 10px; margin: 8px 0 6px; background: rgba(0, 229, 255, .08);
  clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }
.xpbar-fill { background: linear-gradient(90deg, var(--accent-2), var(--accent)); box-shadow: 0 0 12px var(--accent); }
.xpbar::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), var(--bg) calc(10% - 2px) 10%); }
.hud-meta { font-size: 13px; color: var(--muted); }
.today { color: var(--accent); font-weight: 700; }
.today .ic { width: 16px; height: 16px; }

/* Habits */
.habit { padding: 12px 2px; border-bottom: 1px dashed var(--line-soft); transition: background .15s; }
.habit:last-child { border-bottom: 0; }
.habit:active { background: rgba(0, 229, 255, .06); }
.check { width: 26px; height: 26px; position: relative; color: var(--on-accent); }
.check::before { content: ""; position: absolute; inset: 4px; transform: rotate(45deg); border: 1.5px solid var(--accent); transition: background .15s, box-shadow .15s; }
.is-done .check::before { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.check .ic { position: relative; width: 14px; height: 14px; }
.habit-name { font-size: 17px; font-weight: 600; letter-spacing: .02em; }
.is-done .habit-name { color: var(--muted); }
.habit-sub { font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.habit-sub .ic { width: 14px; height: 14px; color: var(--accent); }
.pip { width: 18px; height: 5px; background: rgba(0, 229, 255, .15); transform: skewX(-20deg); }
.pip.on { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
.xp-chip { font: 600 14px var(--f-num); color: var(--accent); padding: 3px 10px; background: rgba(0, 229, 255, .08);
  clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }
.xp-chip small { font-size: 10px; opacity: .7; }
.is-done .xp-chip { background: var(--accent); color: var(--on-accent); }
.xp-float { font: 700 14px var(--f-num); color: var(--accent); text-shadow: 0 0 8px var(--accent); }

/* Stats */
.stats { padding: 10px 0 6px; }
.stat-ic { color: var(--accent); }
.stat-ic .ic { width: 20px; height: 20px; }
.stat-name { font-weight: 700; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
.statbar { height: 8px; background: rgba(0, 229, 255, .08); }
.statbar-fill { background: linear-gradient(90deg, var(--accent-2), var(--accent)); box-shadow: 0 0 8px rgba(0,229,255,.6); }
.statbar::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 8px, var(--panel) 8px 10px); }
.stat-val { color: var(--accent); font-size: 14px; }

/* Buttons */
.btn-row { padding: 12px 0 6px; }
.btn { font-weight: 700; font-size: 14px; letter-spacing: .16em; text-transform: uppercase; padding: 11px 18px;
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); transition: filter .15s, transform .1s; }
.btn:active { transform: translateY(1px); filter: brightness(1.2); }
.btn-primary { background: var(--accent); color: var(--on-accent); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
.btn-secondary { color: var(--accent); background: rgba(0, 229, 255, .08); box-shadow: inset 0 0 0 1px var(--line); }
.btn-ghost { color: var(--muted); }
.type { padding: 8px 0 6px; border-top: 1px solid var(--line-soft); margin-top: 8px; }
.type-h { font-weight: 700; font-size: 22px; letter-spacing: .14em; text-transform: uppercase; }
.type-b { font-size: 16px; }
.type-n { font-size: 16px; color: var(--accent); }
.type-cap { font-size: 12px; color: var(--muted); letter-spacing: .06em; }

/* Tab bar */
.tabbar { background: rgba(4, 7, 12, .92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--line); }
.tabbar::before { content: ""; position: absolute; top: -1px; left: 50%; width: 120px; height: 1px; transform: translateX(-50%);
  background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.tab { position: relative; color: var(--muted); padding: 4px 0; font-weight: 700; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
.tab.is-active { color: var(--accent); }
.tab.is-active .ic { filter: drop-shadow(0 0 6px var(--accent)); }
.tab.is-active::before { content: ""; position: absolute; top: -9px; width: 28px; height: 3px; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
</style>
</head>
<body data-style="tactical" data-default-set="tabler" data-fonts="Rajdhani (headings + body) · Chakra Petch (numbers) — both free, OFL">
<div id="app"></div>
<script src="icons.js"></script>
<script src="sample.js"></script>
</body>
</html>
